<body>

  <div id="app"></div>


  <script>

    /* =========================
       GLOBAL STATE
    ========================= */

    let token =
      sessionStorage.getItem(
        "genzbaothe_admin_token"
      );

    let data = null;


    /* =========================
       LOGIN SCREEN
    ========================= */

    function showLogin() {

      document.getElementById("app").innerHTML = `

        <div class="login">

          <div class="login-box">

            <div class="login-logo">

              <span class="logo">
                G
              </span>

              GenZ BaoThe

            </div>


            <h1>
              Quản trị website
            </h1>


            <p>
              Đăng nhập để chỉnh sửa nội dung,
              sản phẩm và affiliate campaign.
            </p>


            <input
              id="password"
              type="password"
              placeholder="Mật khẩu admin"
              autocomplete="current-password"
            >


            <button
              id="loginButton"
              type="button"
              onclick="login()"
            >
              Đăng nhập
            </button>


            <div
              id="loginError"
              class="login-error"
            ></div>


            <div
              id="loginSuccess"
              class="login-success"
            >
              Đăng nhập thành công. Đang tải Admin...
            </div>


            <div class="login-hint">

              Mật khẩu được cấu hình trong
              Cloudflare Environment Variables
              với tên ADMIN_PASSWORD.

            </div>

          </div>

        </div>

      `;


      const passwordInput =
        document.getElementById(
          "password"
        );


      if (passwordInput) {

        passwordInput.focus();


        passwordInput.addEventListener(
          "keydown",
          function(event) {

            if (
              event.key === "Enter"
            ) {

              login();

            }

          }
        );

      }

    }


    /* =========================
       SHOW LOGIN ERROR
    ========================= */

    function showLoginError(message) {

      const errorBox =
        document.getElementById(
          "loginError"
        );


      if (!errorBox) {

        alert(message);

        return;

      }


      errorBox.textContent =
        message;

      errorBox.style.display =
        "block";


      const successBox =
        document.getElementById(
          "loginSuccess"
        );


      if (successBox) {

        successBox.style.display =
          "none";

      }

    }


    /* =========================
       LOGIN API
    ========================= */

    async function login() {

      const passwordInput =
        document.getElementById(
          "password"
        );

      const loginButton =
        document.getElementById(
          "loginButton"
        );


      const password =
        passwordInput?.value || "";


      if (!password) {

        showLoginError(
          "Vui lòng nhập mật khẩu."
        );

        passwordInput?.focus();

        return;

      }


      loginButton.disabled =
        true;

      loginButton.textContent =
        "Đang đăng nhập...";


      try {

        const response =
          await fetch(
            "/api/admin/login",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  password: password
                })
            }
          );


        const result =
          await response
            .json()
            .catch(
              () => ({})
            );


        if (!response.ok) {

          showLoginError(
            result.error ||
            "Đăng nhập thất bại."
          );

          passwordInput.value = "";

          passwordInput.focus();

          return;

        }


        if (!result.token) {

          showLoginError(
            "Server không trả về token đăng nhập."
          );

          return;

        }


        token =
          result.token;


        sessionStorage.setItem(
          "genzbaothe_admin_token",
          token
        );


        const successBox =
          document.getElementById(
            "loginSuccess"
          );


        if (successBox) {

          successBox.style.display =
            "block";

        }


        loginButton.textContent =
          "Đang tải...";


        await loadAdmin();

      }


      catch (error) {

        console.error(
          "Login error:",
          error
        );


        showLoginError(
          "Không thể kết nối tới server. Vui lòng thử lại."
        );

      }


      finally {

        const button =
          document.getElementById(
            "loginButton"
          );


        if (button) {

          button.disabled =
            false;

          button.textContent =
            "Đăng nhập";

        }

      }

    }


    /* =========================
       ADMIN API
    ========================= */

    async function adminAPI(
      url,
      options = {}
    ) {

      options.headers = {

        ...(options.headers || {}),

        "Authorization":
          "Bearer " + token,

        "Content-Type":
          "application/json"

      };


      const response =
        await fetch(
          url,
          options
        );


      if (
        response.status === 401
      ) {

        sessionStorage.removeItem(
          "genzbaothe_admin_token"
        );

        token = null;

        showLogin();

        throw new Error(
          "Unauthorized"
        );

      }


      return response;

    }


    /* =========================
       LOAD ADMIN DATA
    ========================= */

    async function loadAdmin() {

      try {

        const response =
          await adminAPI(
            "/api/admin/content"
          );


        if (!response.ok) {

          const result =
            await response
              .json()
              .catch(
                () => ({})
              );


          throw new Error(
            result.error ||
            "Không tải được dữ liệu."
          );

        }


        data =
          await response.json();


        renderAdmin();

      }


      catch (error) {

        console.error(
          "Load admin error:",
          error
        );


        if (
          error.message !==
          "Unauthorized"
        ) {

          alert(
            error.message ||
            "Không thể tải dữ liệu."
          );

        }

      }

    }


    /* =========================
       INPUT
    ========================= */

    function input(
      label,
      key,
      value,
      full = false
    ) {

      return `

        <div class="field ${full ? "full" : ""}">

          <label>
            ${label}
          </label>

          <input
            data-key="${key}"
            value="${escapeAttr(value)}"
          >

        </div>

      `;

    }


    /* =========================
       TEXTAREA
    ========================= */

    function textarea(
      label,
      key,
      value
    ) {

      return `

        <div class="field full">

          <label>
            ${label}
          </label>

          <textarea
            data-key="${key}"
          >${escapeHTML(value)}</textarea>

        </div>

      `;

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function escapeAttr(value) {

      return escapeHTML(value);

    }


    /* =========================
       RENDER ADMIN
    ========================= */

    function renderAdmin() {

      const site =
        data.site;


      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="admin">


          <aside class="sidebar">

            <div class="sidebar-brand">
              G GenZ BaoThe
            </div>


            <button
              class="active"
              onclick="scrollToSection('site')"
            >
              📝 Nội dung
            </button>


            <button
              onclick="scrollToSection('stats')"
            >
              📊 Thống kê
            </button>


            <button
              onclick="scrollToSection('products')"
            >
              💳 Campaign
            </button>


            <button
              onclick="window.open('/','_blank')"
            >
              🌐 Xem website
            </button>


            <button
              onclick="logout()"
            >
              ↪ Đăng xuất
            </button>

          </aside>


          <main class="content">


            <div class="topbar">

              <h1>
                Chỉnh sửa website
              </h1>


              <div>

                <span
                  id="status"
                  class="status"
                ></span>


                <button
                  class="save-btn"
                  onclick="saveAll()"
                >
                  Lưu thay đổi
                </button>

              </div>

            </div>


            <!-- SITE -->

            <section
              class="panel"
              id="site"
            >

              <h2>
                🏠 Trang chủ
              </h2>


              <div class="form-grid">

                ${input(
                  "Tên website",
                  "brand",
                  site.brand
                )}


                ${input(
                  "Eyebrow",
                  "heroEyebrow",
                  site.heroEyebrow
                )}


                ${input(
                  "Tiêu đề lớn",
                  "heroTitle",
                  site.heroTitle
                )}


                ${input(
                  "Dòng chữ màu xanh",
                  "heroHighlight",
                  site.heroHighlight
                )}


                ${textarea(
                  "Mô tả Hero",
                  "heroDescription",
                  site.heroDescription
                )}


                ${input(
                  "Tiêu đề phần so sánh",
                  "compareTitle",
                  site.compareTitle
                )}


                ${textarea(
                  "Mô tả phần so sánh",
                  "compareDescription",
                  site.compareDescription
                )}


                ${input(
                  "Tiêu đề CTA",
                  "ctaTitle",
                  site.ctaTitle
                )}


                ${textarea(
                  "Mô tả CTA",
                  "ctaDescription",
                  site.ctaDescription
                )}


                ${textarea(
                  "Mô tả Footer",
                  "footerDescription",
                  site.footerDescription
                )}

              </div>

            </section>


            <!-- STATS -->

            <section
              class="panel"
              id="stats"
            >

              <h2>
                📊 Thống kê
              </h2>


              <div class="form-grid">

                ${input(
                  "Số sản phẩm",
                  "stats.products",
                  site.stats.products
                )}


                ${input(
                  "Người dùng",
                  "stats.users",
                  site.stats.users
                )}


                ${input(
                  "Tỉnh thành",
                  "stats.cities",
                  site.stats.cities
                )}


                ${input(
                  "Hỗ trợ",
                  "stats.support",
                  site.stats.support
                )}

              </div>

            </section>


            <!-- PRODUCTS -->

            <section
              class="panel"
              id="products"
            >

              <h2>

                💳 Sản phẩm / Campaign

                <button
                  class="small-btn add-btn"
                  onclick="addProduct()"
                >
                  + Thêm campaign
                </button>

              </h2>


              <div
                class="product-list"
                id="productList"
              >

                ${renderProducts()}

              </div>

            </section>


          </main>

        </div>

      `;

    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts() {

      return data.products
        .map(
          (product, index) => `

            <div
              class="product"
              data-product="${index}"
            >

              <div class="product-header">

                <div class="product-title">

                  ${escapeHTML(
                    product.icon
                  )}

                  ${escapeHTML(
                    product.name
                  )}

                </div>


                <button
                  class="small-btn delete-btn"
                  onclick="deleteProduct(${index})"
                >
                  Xóa
                </button>

              </div>


              <div class="form-grid">


                ${input(
                  "Ngân hàng",
                  `product.${index}.bank`,
                  product.bank
                )}


                ${input(
                  "Tên campaign",
                  `product.${index}.name`,
                  product.name
                )}


                ${input(
                  "Loại sản phẩm",
                  `product.${index}.category`,
                  product.category
                )}


                ${input(
                  "Icon",
                  `product.${index}.icon`,
                  product.icon
                )}


                ${input(
                  "Badge",
                  `product.${index}.badge`,
                  product.badge
                )}


                ${input(
                  "Hạn mức",
                  `product.${index}.limit`,
                  product.limit
                )}


                ${input(
                  "Kỳ hạn / điều kiện",
                  `product.${index}.term`,
                  product.term
                )}


                ${input(
                  "Affiliate URL",
                  `product.${index}.affiliateUrl`,
                  product.affiliateUrl,
                  true
                )}


                ${textarea(
                  "Mô tả",
                  `product.${index}.description`,
                  product.description
                )}

              </div>

            </div>

          `
        )
        .join("");

    }


    /* =========================
       READ FORM
    ========================= */

    function readForm() {

      document
        .querySelectorAll(
          "[data-key]"
        )
        .forEach(
          element => {

            const key =
              element.dataset.key;


            const value =
              element.value;


            const parts =
              key.split(".");


            if (
              parts[0] === "product"
            ) {

              const index =
                Number(parts[1]);


              const field =
                parts[2];


              if (
                data.products[index]
              ) {

                data.products[index][field] =
                  value;

              }

            }


            else if (
              parts[0] === "stats"
            ) {

              data.site.stats[
                parts[1]
              ] = value;

            }


            else {

              data.site[
                key
              ] = value;

            }

          }
        );

    }


    /* =========================
       SAVE
    ========================= */

    async function saveAll() {

      readForm();


      const status =
        document.getElementById(
          "status"
        );


      status.textContent =
        "Đang lưu...";


      try {

        const response =
          await adminAPI(
            "/api/admin/content",
            {

              method: "PUT",

              body:
                JSON.stringify(
                  data
                )

            }
          );


        if (!response.ok) {

          const result =
            await response
              .json()
              .catch(
                () => ({})
              );


          throw new Error(
            result.error ||
            "Save failed"
          );

        }


        status.textContent =
          "Đã lưu ✓";


        setTimeout(
          () => {

            if (status) {
              status.textContent = "";
            }

          },
          2500
        );

      }


      catch (error) {

        console.error(
          "Save error:",
          error
        );


        status.textContent =
          "Lưu thất bại";

      }

    }


    /* =========================
       ADD PRODUCT
    ========================= */

    function addProduct() {

      readForm();


      data.products.push({

        id:
          "campaign-" +
          Date.now(),

        bank:
          "Ngân hàng",

        name:
          "Sản phẩm mới",

        category:
          "Khoản vay",

        icon:
          "💰",

        badge:
          "Mới",

        description:
          "Mô tả sản phẩm",

        limit:
          "Đang cập nhật",

        term:
          "Đang cập nhật",

        affiliateUrl:
          "https://example.com"

      });


      renderAdmin();


      setTimeout(
        () => {

          const products =
            document.getElementById(
              "products"
            );


          if (products) {

            products.scrollIntoView({
              behavior: "smooth"
            });

          }

        },
        100
      );

    }


    /* =========================
       DELETE PRODUCT
    ========================= */

    function deleteProduct(index) {

      if (
        !confirm(
          "Bạn có chắc muốn xóa campaign này?"
        )
      ) {

        return;

      }


      readForm();


      data.products.splice(
        index,
        1
      );


      renderAdmin();

    }


    /* =========================
       SCROLL
    ========================= */

    function scrollToSection(id) {

      const section =
        document.getElementById(
          id
        );


      if (section) {

        section.scrollIntoView({
          behavior: "smooth"
        });

      }

    }


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

      sessionStorage.removeItem(
        "genzbaothe_admin_token"
      );

      token = null;

      data = null;

      showLogin();

    }


    /* =========================
       START
    ========================= */

    if (token) {

      loadAdmin();

    }

    else {

      showLogin();

    }

  </script>

</body>

</html>
